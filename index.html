```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absensi Mahasiswa</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f5f9;
        }

        .header {
            background: #166534;
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-top: 0;
            color: #166534;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: #166534;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #14532d;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #166534;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8f8f8;
        }

        .kosong {
            text-align: center;
            color: #777;
        }

        .hapus {
            background: #dc2626;
            padding: 7px 10px;
            width: auto;
            margin: 0;
        }

        .hapus:hover {
            background: #b91c1c;
        }

        @media (max-width: 600px) {

            .container {
                width: 95%;
            }

            .header h1 {
                font-size: 22px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>ABSENSI MAHASISWA</h1>
        <p>Universitas Teknokrat Indonesia</p>
    </div>

    <div class="container">

        <!-- FORM ABSENSI -->
        <div class="card">

            <h2>Form Absensi</h2>

            <form id="formAbsensi">

                <label for="npm">NPM</label>
                <input
                    type="text"
                    id="npm"
                    placeholder="Masukkan NPM"
                    required
                >

                <label for="nama">Nama Mahasiswa</label>
                <input
                    type="text"
                    id="nama"
                    placeholder="Masukkan nama lengkap"
                    required
                >

                <label for="kelas">Kelas</label>
                <select id="kelas" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="SI24A">SI24A</option>
                    <option value="SI24B">SI24B</option>
                    <option value="SI24C">SI24C</option>
                </select>

                <label for="matakuliah">Mata Kuliah</label>
                <input
                    type="text"
                    id="matakuliah"
                    value="Pemrograman Web"
                    readonly
                >

                <label for="status">Status Kehadiran</label>
                <select id="status" required>
                    <option value="">-- Pilih Status --</option>
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>

                <button type="submit">
                    ABSEN SEKARANG
                </button>

            </form>

        </div>

        <!-- TABEL ABSENSI -->
        <div class="card">

            <h2>Data Absensi</h2>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>No</th>
                            <th>NPM</th>
                            <th>Nama</th>
                            <th>Kelas</th>
                            <th>Mata Kuliah</th>
                            <th>Tanggal</th>
                            <th>Jam</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelAbsensi">

                        <tr id="dataKosong">
                            <td colspan="9" class="kosong">
                                Belum ada data absensi
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        const form = document.getElementById("formAbsensi");
        const tabel = document.getElementById("tabelAbsensi");

        let nomor = 1;

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            // Mengambil data dari form
            const npm = document.getElementById("npm").value;
            const nama = document.getElementById("nama").value;
            const kelas = document.getElementById("kelas").value;
            const matakuliah =
                document.getElementById("matakuliah").value;
            const status = document.getElementById("status").value;

            // Mengambil tanggal dan jam sekarang
            const sekarang = new Date();

            const tanggal =
                sekarang.toLocaleDateString("id-ID");

            const jam =
                sekarang.toLocaleTimeString("id-ID");

            // Menghapus tulisan "Belum ada data"
            const dataKosong =
                document.getElementById("dataKosong");

            if (dataKosong) {
                dataKosong.remove();
            }

            // Membuat baris baru
            const baris = document.createElement("tr");

            baris.innerHTML = `
                <td>${nomor}</td>
                <td>${npm}</td>
                <td>${nama}</td>
                <td>${kelas}</td>
                <td>${matakuliah}</td>
                <td>${tanggal}</td>
                <td>${jam}</td>
                <td>${status}</td>
                <td>
                    <button
                        class="hapus"
                        onclick="hapusData(this)"
                    >
                        Hapus
                    </button>
                </td>
            `;

            tabel.appendChild(baris);

            nomor++;

            // Mengosongkan form
            form.reset();

            // Mata kuliah tetap Pemrograman Web
            document.getElementById("matakuliah").value =
                "Pemrograman Web";

            alert("Absensi berhasil!");

        });


        // Fungsi menghapus data
        function hapusData(button) {

            button.parentElement.parentElement.remove();

        }

    </script>

</body>
</html>
```
